# Profile prod vẫn dùng H2 file bền vững nhưng không nạp tài khoản/món mẫu.
# Có thể đổi đường dẫn bằng DB_URL khi triển khai lên máy chủ.
spring.datasource.url=${DB_URL:jdbc:h2:file:./runtime-data/foodfast-prod;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
spring.h2.console.enabled=false
