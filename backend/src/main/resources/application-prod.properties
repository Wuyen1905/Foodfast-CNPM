# Production never loads demo data. Supply DB_PASSWORD and, when needed, DB_URL
# and DB_USERNAME through the deployment environment.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/foodfast_prod?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=false&sslMode=VERIFY_IDENTITY}
spring.datasource.username=${DB_USERNAME:foodfast_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.locations=classpath:db/mysql
