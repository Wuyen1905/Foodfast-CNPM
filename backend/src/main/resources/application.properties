# Development is the default profile. It uses MySQL; automated tests override it
# with an isolated H2 database in src/test/resources/application-test.properties.
spring.profiles.default=dev

# Flyway owns schema changes. Hibernate only validates entity/migration parity and
# can no longer erase data during a restart.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# 1500 điểm cơ bản = 15%. Tỷ lệ được chụp lại trên từng đợt đối soát.
settlement.commission-rate-bps=${SETTLEMENT_COMMISSION_RATE_BPS:1500}

# Server Configuration
server.address=0.0.0.0
server.port=8080

# JWT authentication. Production must provide a private value via AUTH_JWT_SECRET.
# Local development without it gets a random key for the current backend process.
auth.jwt.secret=${AUTH_JWT_SECRET:}
auth.jwt.expirationMinutes=${AUTH_JWT_EXPIRATION_MINUTES:480}

# VNPay Payment Gateway
# Không ghi TmnCode/HashSecret trực tiếp vào Git. Điền bằng biến môi trường sau khi
# VNPay cấp tài khoản Sandbox.
vnpay.enabled=${VNPAY_ENABLED:false}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:5173/vnpay-return}
vnpay.frontendReturnUrl=${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/vnpay-return}
vnpay.expireMinutes=${VNPAY_EXPIRE_MINUTES:15}
