# Local secrets and connection details are loaded automatically when this file is
# present. It is ignored by Git. The example file documents the required keys.
spring.config.import=optional:file:.env.mysql.local[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/foodfast_dev?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED}
spring.datasource.username=${DB_USERNAME:foodfast_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development keeps versioned demo data. Existing H2 data is copied over once by
# the migration utility, while clean developer databases receive V2 demo data.
spring.flyway.locations=classpath:db/mysql,classpath:db/mysql-dev
